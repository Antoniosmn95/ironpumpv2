<!-- verify.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Verifying…</title>
  <style>
    body{font-family:system-ui,Segoe UI,Inter,Arial,sans-serif;background:#121212;color:#F6F2F2;display:grid;place-items:center;height:100dvh;margin:0}
    .card{background:#171717;border:1px solid rgba(144,144,144,.35);padding:24px;border-radius:14px;max-width:520px}
    .ok{color:#97FB57}.err{color:#ff6b6b}
  </style>

  <!-- Your modular firebase-init (same file you already have) -->
  <script type="module" src="firebase-init.js"></script>
  <script type="module">
    import { getAuth, applyActionCode, checkActionCode } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
    import { app } from "./firebase-init.js";

    const auth = getAuth(app);

    const params = new URLSearchParams(location.search);
    const mode   = params.get("mode");
    const oobCode= params.get("oobCode");
    const cont   = params.get("continueUrl") || "login.html";

    const box = document.getElementById("box");

    async function run(){
      if (mode !== "verifyEmail" || !oobCode){
        box.innerHTML = `<h2 class="err">Invalid link</h2><p>Missing or wrong parameters.</p>`;
        return;
      }
      try {
        // Optional: sanity check so we can show a friendlier error before applying
        await checkActionCode(auth, oobCode);
        await applyActionCode(auth, oobCode);
        box.innerHTML = `<h2 class="ok">Email verified!</h2><p>Redirecting to sign in…</p>`;
        setTimeout(()=>location.replace(cont), 900);
      } catch (e) {
        console.error(e);
        box.innerHTML = `<h2 class="err">Link expired or already used</h2>
                         <p>Please go back and request a new verification email, then open the latest message.</p>`;
      }
    }
    run();
  </script>
</head>
<body>
  <div class="card" id="box">Verifying your email…</div>
</body>
</html>
