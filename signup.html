<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Sign Up — IronPump</title>

  <!-- UI libs -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/feather-icons"></script>

  <!-- Your modular Firebase init -->
  <script type="module" src="firebase-init.js"></script>

  <!-- Flatpickr (optional themed date picker) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root{
      --accent:#97FB57; --bg:#121212; --muted:#909090; --light:#F6F2F2;
      --base-fs:14px;
      --gap-sm:.5rem; --gap-md:.65rem; --gap-lg:.9rem;
      --input-h:34px; --input-pad-y:.45rem; --input-pad-x:.6rem; --radius:.6rem;
    }

    html,body{ height:100%; }
    body{
      font-family:'Inter',sans-serif; background:var(--bg); color:var(--light);
      padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
      font-size: var(--base-fs); line-height: 1.34;
    }

    .panel{ background:#161616; border:1px solid rgba(144,144,144,0.35); }
    .accent-text{ color:var(--accent); }
    .text-muted{ color:var(--muted); }

    .btn-accent{
      background:var(--accent); color:var(--bg);
      box-shadow:0 0 8px rgba(151,251,87,0.35), inset 0 0 0 1px rgba(18,18,18,0.4);
      transition:filter .15s ease, transform .05s ease;
    }
    .btn-accent:hover{ filter:brightness(.95); }
    .btn-accent:active{ transform:translateY(1px); }
    .btn-ghost{ background:#232323; color:var(--light); border:1px solid rgba(144,144,144,0.35); }

    .input{
      width:100%;
      padding:var(--input-pad-y) var(--input-pad-x);
      border-radius:var(--radius);
      background:#1e1e1e; border:1px solid rgba(144,144,144,.35); outline:none;
      min-height:var(--input-h);
    }
    .input:focus{ outline:2px solid var(--accent); }

    label{ font-size:.85rem; margin-bottom:.35rem; display:block; }
    .help, small{ font-size:.75rem; color:var(--muted); }

    .form-grid{
      display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: var(--gap-md) var(--gap-lg); align-items:start;
    }
    .stack{ display:flex; flex-direction:column; gap:var(--gap-sm); }

    .title { font-size: 1.55rem; }

    .spinner {
      width: 18px; height: 18px; border-radius: 9999px;
      border: 2px solid rgba(255,255,255,.25); border-top-color: rgba(255,255,255,.95);
      animation: spin .8s linear infinite; display:inline-block; vertical-align: -2px; margin-right: .45rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Fullscreen welcome overlay */
    #welcomeOverlay{
      position: fixed; inset: 0; background: rgba(0,0,0,.75);
      display: none; align-items: center; justify-content: center; z-index: 9999;
      backdrop-filter: blur(2px); animation: fadeIn .15s ease-out;
    }
    .welcome-card{
      background:#151515; border:1px solid rgba(144,144,144,.35);
      border-radius: 1rem; padding: 1.25rem 1.4rem; text-align: center; width: 90%; max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
      animation: pop .18s ease-out;
    }
    .welcome-logo{
      width: 72px; height: 72px; border-radius: .75rem; object-fit: contain;
      border:1px solid rgba(144,144,144,.35); background:#111; margin: 0 auto .65rem;
    }
    .welcome-spinner{
      width: 22px; height: 22px; border-width: 3px; margin: .35rem auto 0;
      border-radius: 9999px; border: 3px solid rgba(255,255,255,.22); border-top-color: #fff; animation: spin .8s linear infinite;
    }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
    @keyframes pop { from { transform: translateY(6px) scale(.98); opacity:.9 } to { transform: translateY(0) scale(1); opacity:1 } }
  </style>
</head>
<body class="min-h-[100svh] flex items-start justify-center p-3 md:p-4">
  <main class="w-full max-w-[800px]">
    <div class="mb-3 text-center">
      <h1 class="title font-bold tracking-tight"><span class="accent-text">Iron</span>Pump</h1>
      <p class="text-xs text-muted mt-1">Create your account</p>
    </div>

    <section class="panel rounded-xl p-3.5">
      <form id="signupForm" class="stack" style="gap:var(--gap-md)" novalidate>
        <!-- Auth block -->
        <div class="form-grid">
          <div class="stack">
            <label for="email">Email</label>
            <input id="email" type="email" required
              autocapitalize="none" autocomplete="email" spellcheck="false" autocorrect="off"
              class="input" placeholder="you@example.com"/>
          </div>
          <div class="stack">
            <label for="password">Password</label>
            <div class="relative">
              <input id="password" type="password" required minlength="6" pattern="^\S+$"
                class="input pr-10" placeholder="••••••••" autocomplete="new-password"/>
              <button type="button" id="togglePw"
                class="absolute right-2 top-1/2 -translate-y-1/2 p-1 text-muted"
                aria-label="Toggle password" style="line-height:0">
                <i data-feather="eye" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
          <div class="stack">
            <label for="password2">Confirm Password</label>
            <input id="password2" type="password" required pattern="^\S+$"
              class="input" placeholder="Repeat password" autocomplete="new-password"/>
          </div>
          <div class="stack">
            <label for="fullName">Full Name</label>
            <input id="fullName" type="text"
              pattern="^[A-Za-z\u0600-\u06FF\s]{2,}$"
              title="Only letters and spaces are allowed"
              class="input" placeholder="Your name" autocomplete="name"/>
          </div>
          <div class="stack">
            <label for="dob">Date of Birth</label>
            <input id="dob" type="date" class="input" required
              min="1900-01-01" placeholder="YYYY-MM-DD"/>
            <small class="help">Click to open the calendar.</small>
          </div>
        </div>

        <!-- Profile image -->
        <div class="stack">
          <label for="photo">Profile Picture</label>
          <input id="photo" type="file" accept="image/*" class="input"/>
          <small>Optional. JPG/PNG ≤ 5 MB.</small>
        </div>

        <!-- Stats -->
        <div class="form-grid">
          <div class="stack">
            <label for="phone">Phone Number</label>
            <input id="phone" type="tel" inputmode="tel" maxlength="17"
              pattern="^\+?[0-9][0-9\s\-]{5,14}$"
              title="Digits only (6–15), spaces and - allowed, optional + at start"
              class="input" placeholder="+961 71 234 567"/>
          </div>
          <div class="stack">
            <label for="height">Height (cm)</label>
            <input id="height" type="number" min="100" max="250" step="1" inputmode="numeric"
              class="input" placeholder="e.g. 178"/>
          </div>
          <div class="stack">
            <label for="weight">Weight (kg)</label>
            <input id="weight" type="number" min="30" max="300" step="0.1" inputmode="decimal"
              class="input" placeholder="e.g. 75"/>
          </div>
        </div>

        <!-- Preferences -->
        <div class="form-grid">
          <div class="stack">
            <label for="country">Country</label>
            <select id="country" class="input">
              <option value="" selected disabled>Select Country</option>
              <option value="Lebanon">🇱🇧 Lebanon</option>
              <option value="Saudi Arabia">🇸🇦 Saudi Arabia</option>
              <option value="UAE">🇦🇪 United Arab Emirates</option>
              <option value="Qatar">🇶🇦 Qatar</option>
              <option value="Kuwait">🇰🇼 Kuwait</option>
              <option value="Bahrain">🇧🇭 Bahrain</option>
              <option value="Oman">🇴🇲 Oman</option>
              <option value="Egypt">🇪🇬 Egypt</option>
              <option value="Jordan">🇯🇴 Jordan</option>
              <option value="Syria">🇸🇾 Syria</option>
              <option value="Iraq">🇮🇶 Iraq</option>
              <option value="Yemen">🇾🇪 Yemen</option>
              <option value="Morocco">🇲🇦 Morocco</option>
              <option value="Algeria">🇩🇿 Algeria</option>
              <option value="Tunisia">🇹🇳 Tunisia</option>
              <option value="Libya">🇱🇾 Libya</option>
              <option value="Sudan">🇸🇩 Sudan</option>
              <option value="Palestine">🇵🇸 Palestine</option>
            </select>
          </div>

          <div class="stack">
            <label for="languages">Languages (comma-separated)</label>
            <input id="languages" type="text"
              pattern="^[A-Za-z\u0600-\u06FF,\s]+$"
              title="Only letters (Arabic/Latin), commas and spaces"
              class="input" placeholder="English, Arabic"/>
          </div>

          <div class="stack">
            <label>Training Location</label>
            <div class="flex gap-3">
              <label class="inline-flex items-center gap-2"><input type="radio" name="where" value="home" checked><span>Home</span></label>
              <label class="inline-flex items-center gap-2"><input type="radio" name="where" value="gym"><span>Gym</span></label>
            </div>
          </div>

          <div class="stack">
            <label class="text-xs">Days per Week</label>
            <div id="daysSelector" class="flex flex-wrap gap-2">
              <button type="button" class="day-btn btn-ghost px-3 py-1.5 rounded-md text-sm" data-value="1">1</button>
              <button type="button" class="day-btn btn-ghost px-3 py-1.5 rounded-md text-sm" data-value="2">2</button>
              <button type="button" class="day-btn btn-ghost px-3 py-1.5 rounded-md text-sm" data-value="3">3</button>
              <button type="button" class="day-btn btn-ghost px-3 py-1.5 rounded-md text-sm" data-value="4">4</button>
              <button type="button" class="day-btn btn-ghost px-3 py-1.5 rounded-md text-sm" data-value="5">5</button>
              <button type="button" class="day-btn btn-ghost px-3 py-1.5 rounded-md text-sm" data-value="6">6</button>
              <button type="button" class="day-btn btn-ghost px-3 py-1.5 rounded-md text-sm" data-value="7">7</button>
            </div>
            <input type="hidden" id="days" value="4">
            <small id="daysHint">Selected: 4 days/week</small>
          </div>
        </div>

        <div class="stack">
          <label for="extra" class="text-xs">Additional Info</label>
          <textarea id="extra" rows="3" class="input" placeholder="Any injuries, goals, notes…"></textarea>
        </div>

        <button id="createBtn" class="w-full btn-accent py-2 rounded-lg font-medium flex items-center justify-center gap-2">
          <i data-feather="user-plus" class="w-4 h-4"></i><span>Create Account</span>
        </button>

        <p id="status" class="text-[12px] h-4"></p>

        <p class="text-xs text-center">Already have an account?
          <a href="login.html" class="accent-text hover:underline">Log in</a>
        </p>
      </form>
    </section>

    <p class="text-[11px] text-center text-muted mt-3">By registering you agree to our Terms & Privacy Policy.</p>
  </main>

  <!-- Welcome overlay (shown after signup) -->
  <div id="welcomeOverlay" aria-hidden="true">
    <div class="welcome-card">
      <img src="ironpump.png" alt="IronPump" class="welcome-logo">
      <h3 class="text-lg font-semibold mb-1">Welcome to <span class="accent-text">Iron</span>Pump</h3>
      <p class="text-sm text-muted">We’re setting up your dashboard…</p>
      <div class="welcome-spinner" role="status" aria-label="Loading"></div>
    </div>
  </div>

  <script type="module">
    feather.replace();

    import { app, auth as exportedAuth, db as exportedDb } from './firebase-init.js';
    import {
      getAuth, createUserWithEmailAndPassword, onAuthStateChanged, updateProfile, reload
    } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
    import {
      getFirestore, doc, setDoc, serverTimestamp
    } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';
    import {
      getStorage, ref, uploadBytes, getDownloadURL
    } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-storage.js';

    // Use the initialized app
    const auth = exportedAuth || getAuth(app);
    const db   = exportedDb   || getFirestore(app);
    const storage = getStorage(app);

    const JUST_KEY = 'ironpump_justSignedUp';

    // Helpers
    const $ = (id) => document.getElementById(id);
    const statusEl = $('status');

    function setLoading(b){
      const createBtn = $('createBtn');
      createBtn.disabled = b;
      createBtn.style.opacity = b ? .7 : 1;
      statusEl.textContent = b ? 'Creating account…' : '';
      statusEl.style.color = b ? 'var(--muted)' : '';
    }
    function showError(m){ statusEl.textContent = m; statusEl.style.color = '#ff6b6b'; }

    // Keep email clean
    (() => {
      const em = $('email');
      if (!em) return;
      em.addEventListener('input', () => { em.value = em.value.replace(/\s+/g, ''); });
      em.addEventListener('blur',  () => { em.value = em.value.trim(); });
    })();

    // DoB max = today
    (() => {
      const d = $('dob');
      if (d) d.max = new Date().toISOString().slice(0,10);
    })();

    // Eye toggle
    const togglePwBtn = $('togglePw');
    togglePwBtn.addEventListener('click', () => {
      const pw = $('password');
      const isPassword = pw.type === 'password';
      pw.type = isPassword ? 'text' : 'password';
      togglePwBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
      const icon = isPassword ? 'eye-off' : 'eye';
      togglePwBtn.querySelector('i').setAttribute('data-feather', icon);
      feather.replace();
    });

    // Live sanitizers
    $('phone').addEventListener('input', (e) => {
      let v = e.target.value;
      v = v.replace(/[^\d+\s-]/g, '').replace(/(?!^)\+/g, '');
      e.target.value = v;
    });
    $('fullName').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^A-Za-z\u0600-\u06FF\s]/g, '');
    });
    $('languages').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^A-Za-z\u0600-\u06FF,\s]/g, '');
    });

    function syncPasswordMatch(){
      const p1 = $('password').value;
      const p2 = $('password2');
      if (p2.value && p1 !== p2.value) p2.setCustomValidity('Passwords do not match.');
      else p2.setCustomValidity('');
    }
    $('password').addEventListener('input', syncPasswordMatch);
    $('password2').addEventListener('input', syncPasswordMatch);

    // Days segmented control
    const buttons = document.querySelectorAll('.day-btn');
    const daysField = $('days');
    const daysHint = $('daysHint');
    function setActive(value) {
      buttons.forEach(btn => {
        const active = btn.dataset.value === value;
        btn.classList.toggle('btn-accent', active);
        btn.classList.toggle('btn-ghost', !active);
      });
      daysField.value = value;
      daysHint.textContent = `Selected: ${value} day${value === '1' ? '' : 's'}/week`;
    }
    buttons.forEach(btn => btn.addEventListener('click', () => setActive(btn.dataset.value)));
    setActive('4');

    // If already signed in (fresh visit) and not just-signed-up, go to dashboard
    onAuthStateChanged(auth, async (u) => {
      if (!u) return;
      try { await reload(u); } catch {}
      if (sessionStorage.getItem(JUST_KEY) === '1') return; // let the overlay flow handle redirect
      window.location.replace('index.html');
    });

    // Submit
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      ['email','fullName','phone','languages','extra'].forEach(id => {
        const el = $(id); if (el && typeof el.value === 'string') el.value = el.value.trim();
      });

      syncPasswordMatch();
      if (!e.target.checkValidity()) {
        e.target.reportValidity();
        showError('Please fix the highlighted fields.');
        return;
      }

      const email = $('email').value;
      const password = $('password').value;
      const password2 = $('password2').value;
      const fullName = $('fullName').value;
      const phone = $('phone').value;
      const height = Number($('height').value || 0);
      const weight = Number($('weight').value || 0);
      const dob = $('dob').value;
      const country = $('country').value.trim();
      const languages = $('languages').value.trim();
      const where = (document.querySelector('input[name="where"]:checked') || {}).value || 'home';
      const days = Number($('days').value || 4);
      const extra = $('extra').value.trim();
      const photoFile = $('photo').files[0];

      if (password !== password2) { showError('Passwords do not match.'); return; }
      if (password.length < 6) { showError('Password must be at least 6 characters.'); return; }

      try{
        setLoading(true);

        const cred = await createUserWithEmailAndPassword(auth, email, password);
        const uid = cred.user.uid;

        // Photo upload (optional)
        let photoURL = '';
        if (photoFile) {
          if (photoFile.size > 5 * 1024 * 1024) throw new Error('Image too large (max 5 MB).');
          const key = `users/${uid}/profile.jpg`;
          const r = ref(storage, key);
          await uploadBytes(r, photoFile, { contentType: photoFile.type || 'image/jpeg' });
          photoURL = await getDownloadURL(r);
          await updateProfile(cred.user, { displayName: fullName || '', photoURL });
        } else {
          await updateProfile(cred.user, { displayName: fullName || '' });
        }

        // Save /users/{uid} with role=client
        await setDoc(doc(db, 'users', uid), {
          role: 'client',
          email, fullName, phone, height, weight, dateOfBirth: dob, country,
          languages: languages ? languages.split(',').map(s=>s.trim()).filter(Boolean) : [],
          trainingPlace: where,
          daysPerWeek: days,
          additionalInfo: extra,
          photoURL,
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        }, { merge: true });

        // Show welcome overlay and redirect shortly
        sessionStorage.setItem(JUST_KEY, '1');
        const overlay = document.getElementById('welcomeOverlay');
        overlay.style.display = 'flex';
        setTimeout(() => {
          sessionStorage.removeItem(JUST_KEY);
          window.location.replace('index.html');
        }, 1400); // feel free to tweak duration

      }catch(err){
        console.error(err);
        showError(prettyAuthError(err));
      }finally{
        setLoading(false);
      }
    });

    function prettyAuthError(err){
      const code = String(err?.code || '');
      if (code.startsWith('auth/')) {
        switch (code) {
          case 'auth/email-already-in-use': return 'Email is already registered.';
          case 'auth/invalid-email': return 'Invalid email address.';
          case 'auth/operation-not-allowed': return 'Email/password sign-in is disabled.';
          case 'auth/weak-password': return 'Password is too weak.';
          default: return err.message || 'Sign up failed. Please try again.';
        }
      }
      if (code.includes('permission-denied')) return 'You don’t have permission to save your profile.';
      return err.message || 'Something went wrong. Please try again.';
    }

    // Flatpickr (optional)
    window.addEventListener('DOMContentLoaded', () => {
      if (window.flatpickr) {
        flatpickr("#dob", {
          dateFormat: "Y-m-d",
          minDate: "1900-01-01",
          maxDate: "today",
          allowInput: true,
          disableMobile: true
        });
      }
    });
  </script>
</body>
</html>
