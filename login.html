<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — IronPump</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- UI libs -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/feather-icons"></script>

  <!-- Modular Firebase init + optional guard -->
  <script type="module" src="firebase-init.js"></script>
  <script type="module" src="auth-guard.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    :root{ --accent:#97FB57; --bg:#121212; --muted:#909090; --light:#F6F2F2; }
    html,body{height:100%}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--light)}
    .panel{background:#161616;border:1px solid rgba(144,144,144,.35)}
    .accent-text{color:var(--accent)}
    .btn-accent{background:var(--accent);color:var(--bg);box-shadow:0 0 12px rgba(151,251,87,.45), inset 0 0 0 1px rgba(18,18,18,.4);transition:filter .15s ease, transform .05s ease}
    .btn-accent:hover{filter:brightness(.95)}
    .btn-accent:active{transform:translateY(1px)}
    .btn-ghost{background:#232323;color:var(--light);border:1px solid rgba(144,144,144,.35)}
    .text-muted{color:var(--muted)}
    .input{width:100%;padding:.6rem .75rem;border-radius:.75rem;background:#1e1e1e;border:1px solid rgba(144,144,144,.35);outline:none}
    .input:focus{outline:2px solid var(--accent)}
    .seg{display:flex;background:#1b1b1b;border:1px solid rgba(144,144,144,.35);border-radius:9999px;padding:4px;gap:4px}
    .seg button{flex:1;padding:.5rem .75rem;border-radius:9999px;font-weight:600;color:var(--light);background:transparent;border:none;cursor:pointer}
    .seg button.active{background:var(--accent);color:var(--bg);box-shadow:0 0 10px rgba(151,251,87,.35) inset}
    .logo{width:80px;height:auto;margin:0 auto 10px;display:block}
    #status{color:var(--muted);min-height:1.25rem}
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <main class="w-full max-w-md">
    <div class="text-center mb-2">
      <img src="ironpump.png" alt="IronPump Logo" class="logo">
      <h1 class="text-3xl font-bold tracking-tight"><span class="accent-text">Iron</span>Pump</h1>
    </div>
    <p class="text-sm text-muted text-center mb-6">Choose your role and log in to your account.</p>

    <section class="panel rounded-2xl p-6">
      <div class="mb-4">
        <label class="block text-sm mb-2">Log in as</label>
        <div class="seg" role="tablist" aria-label="Login role">
          <button type="button" id="roleClient" class="active" role="tab" aria-selected="true">Client</button>
          <button type="button" id="roleTrainer" role="tab" aria-selected="false">Trainer</button>
        </div>
        <p class="text-xs text-muted mt-2" id="roleHint">You’re logging in as <span class="accent-text font-semibold">Client</span>.</p>
      </div>

      <form id="loginForm" class="space-y-4" novalidate>
        <div>
          <label for="email" class="block text-sm mb-1">Email</label>
          <input id="email" type="email" required class="input" placeholder="you@example.com" autocomplete="email"/>
        </div>
        <div>
          <div class="flex items-center justify-between mb-1">
            <label for="password" class="block text-sm">Password</label>
            <button type="button" id="forgotBtn" class="text-sm accent-text hover:underline">Forgot password?</button>
          </div>
          <div class="relative">
            <input id="password" type="password" required class="input pr-10" placeholder="••••••••" autocomplete="current-password"/>
            <button type="button" id="togglePw" class="absolute right-2 top-1/2 -translate-y-1/2 p-1 text-muted" aria-label="Show password">
              <i data-feather="eye"></i>
            </button>
          </div>
        </div>
        <div class="flex items-center justify-between gap-2 flex-wrap">
          <label class="inline-flex items-center gap-2 text-sm">
            <input id="remember" type="checkbox" class="accent-[var(--accent)]">
            <span>Remember me</span>
          </label>
          <a href="signup.html" id="registerClient" class="text-sm accent-text hover:underline">Are you a client? Register here</a>
          <a href="signup-trainer.html" id="registerTrainer" class="text-sm accent-text hover:underline hidden">Are you a trainer? Register here</a>
        </div>
        <button id="loginBtn" class="w-full btn-accent py-2.5 rounded-lg font-medium flex items-center justify-center gap-2">
          <i data-feather="log-in" class="w-4 h-4"></i><span>Log In</span>
        </button>
        <p id="status" class="text-sm mt-2"></p>
      </form>
    </section>

    <p class="text-center text-xs text-muted mt-4">
      By continuing you agree to our Terms & Privacy Policy.
    </p>
  </main>

  <script type="module">
    feather.replace();

    import { app, auth as exportedAuth, db as exportedDb } from './firebase-init.js';
    import {
      getAuth, setPersistence,
      browserLocalPersistence, browserSessionPersistence,
      signInWithEmailAndPassword, sendPasswordResetEmail,
      onAuthStateChanged, reload, signOut
    } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
    import {
      getFirestore, doc, getDoc
    } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';

    const auth = exportedAuth || getAuth(app);
    const db   = exportedDb   || getFirestore(app);

    // ---- Role UI logic ----
    let chosenRole = sessionStorage.getItem('ironpump_chosenRole') || 'client';
    const roleClientBtn = document.getElementById('roleClient');
    const roleTrainerBtn = document.getElementById('roleTrainer');
    const roleHint = document.getElementById('roleHint');
    const regClient = document.getElementById('registerClient');
    const regTrainer = document.getElementById('registerTrainer');

    function setRole(role){
      const isClient = role === 'client';
      chosenRole = role;
      sessionStorage.setItem('ironpump_chosenRole', chosenRole);
      roleClientBtn.classList.toggle('active', isClient);
      roleTrainerBtn.classList.toggle('active', !isClient);
      roleHint.innerHTML = `You’re logging in as <span class="accent-text font-semibold">${isClient ? 'Client' : 'Trainer'}</span>.`;
      regClient.classList.toggle('hidden', !isClient);
      regTrainer.classList.toggle('hidden', isClient);
    }
    roleClientBtn.addEventListener('click', () => setRole('client'));
    roleTrainerBtn.addEventListener('click', () => setRole('trainer'));
    setRole(chosenRole);

    // ---- Helpers ----
    const $ = (id) => document.getElementById(id);
    const emailEl = $('email');
    const pwEl = $('password');
    const rememberEl = $('remember');
    const statusEl = $('status');
    const loginBtn = $('loginBtn');

    // Clean email input
    (() => {
      if (!emailEl) return;
      emailEl.addEventListener('input', () => { emailEl.value = emailEl.value.replace(/\s+/g, ''); });
      emailEl.addEventListener('blur',  () => { emailEl.value = emailEl.value.trim(); });
    })();

    function friendlyAuthError(err){
      const code = String(err?.code || '');
      if (code.includes('invalid-credential')) return 'Email or password is incorrect.';
      if (code.includes('user-not-found'))     return 'No account found with that email.';
      if (code.includes('wrong-password'))     return 'Email or password is incorrect.';
      if (code.includes('too-many-requests'))  return 'Too many attempts. Please try again later.';
      if (code.includes('network-request-failed')) return 'Network error. Check your connection.';
      return err?.message || 'Something went wrong. Please try again.';
    }
    function routeFor(role) {
      const next = new URLSearchParams(location.search).get('next');
      return role === 'trainer' ? (next || 'trainer-dashboard.html') : (next || 'index.html');
    }

    function rememberRole(role){
      try {
        if (!role) return;
        sessionStorage.setItem('ironpump_lastRole', role);
        localStorage.setItem('ironpump_lastRole', role);
      } catch {}
    }

    async function fetchUserRole(uid, fallbackRole) {
      try {
        const snap = await getDoc(doc(db, 'users', uid));
        if (snap.exists()) {
          const data = snap.data() || {};
          // Accept either role: "client"/"trainer" or roles: ["client", ...]
          const stored = Array.isArray(data.roles)
            ? String(data.roles[0] || 'client').toLowerCase()
            : String(data.role || 'client').toLowerCase();
          return stored === 'trainer' ? 'trainer' : 'client';
        }
        console.warn('[Login] No /users doc for uid; using selected tab as fallback:', fallbackRole);
      } catch (e) {
        console.warn('[Login] getDoc failed, using fallback role:', e);
      }
      return (fallbackRole || 'client').toLowerCase();
    }

    function showRoleMismatchError(selected, actual){
      const want = selected === 'trainer' ? 'Trainer' : 'Client';
      const have = actual   === 'trainer' ? 'Trainer' : 'Client';
      statusEl.style.color = '#ff6b6b';
      statusEl.textContent =
        `This account is ${have}. Switch the toggle to ${have} or register a new ${want} account.`;
    }

    // ---- Password eye toggle ----
    document.getElementById('togglePw').addEventListener('click', () => {
      const isPassword = pwEl.type === 'password';
      pwEl.type = isPassword ? 'text' : 'password';
      const icon = isPassword ? 'eye-off' : 'eye';
      const iconEl = document.querySelector('#togglePw i');
      if (iconEl) { iconEl.setAttribute('data-feather', icon); feather.replace(); }
    });

    // ---- Forgot password ----
    document.getElementById('forgotBtn').addEventListener('click', async () => {
      const email = emailEl.value.trim();
      statusEl.style.color = 'var(--muted)';
      statusEl.textContent = '';
      if (!email) { statusEl.textContent = 'Enter your email first.'; return; }
      try {
        await sendPasswordResetEmail(auth, email);
        statusEl.textContent = 'Password reset email sent.'; statusEl.style.color = 'var(--accent)';
      } catch (e) {
        statusEl.textContent = friendlyAuthError(e); statusEl.style.color = '#ff6b6b';
      }
    });

    // ---- Login submit (STRICT role enforcement) ----
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailEl.value.trim();
      const pass  = pwEl.value;
      statusEl.style.color = 'var(--muted)';
      statusEl.textContent = '';
      if (!email || !pass) { statusEl.textContent = 'Please fill in email and password.'; return; }

      try {
        loginBtn.disabled = true;

        await setPersistence(auth, rememberEl.checked
          ? browserLocalPersistence
          : browserSessionPersistence);

        // 1) Sign in
        const cred = await signInWithEmailAndPassword(auth, email, pass);

        // 2) Get Firestore role (source of truth)
        const actualRole = await fetchUserRole(cred.user.uid, 'client');

        // 3) STRICT MATCH: selected toggle must equal Firestore role
        if (actualRole !== chosenRole) {
          // Block, message, and sign out
          showRoleMismatchError(chosenRole, actualRole);
          try { await signOut(auth); } catch {}
          return;
        }

        // 4) Proceed to the correct area
        rememberRole(actualRole);
        location.replace(routeFor(actualRole));

      } catch (e) {
        console.error('[Auth] signIn failed:', e.code, e.message);
        statusEl.textContent = friendlyAuthError(e);
        statusEl.style.color = '#ff6b6b';
      } finally {
        loginBtn.disabled = false;
      }
    });

    // ---- Already signed-in case: send to correct dashboard by Firestore role
    onAuthStateChanged(auth, async (u) => {
      if (!u) return;
      try { await reload(u); } catch {}
      const actualRole = await fetchUserRole(u.uid, 'client');
      rememberRole(actualRole);
      location.replace(routeFor(actualRole));
    });
  </script>
</body>
</html>
