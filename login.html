<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — IronPump</title>

  <!-- Tailwind + Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/feather-icons"></script>

  <!-- Your modular Firebase init (v12) -->
  <script type="module" src="./firebase-init.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    :root{ --accent:#97FB57; --bg:#121212; --muted:#909090; --light:#F6F2F2; }
    html,body{height:100%}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--light)}
    .panel{background:#161616;border:1px solid rgba(144,144,144,.35)}
    .accent-text{color:var(--accent)}
    .btn-accent{background:var(--accent);color:var(--bg);box-shadow:0 0 12px rgba(151,251,87,.45), inset 0 0 0 1px rgba(18,18,18,.4);transition:filter .15s ease, transform .05s ease}
    .btn-accent:hover{filter:brightness(.95)}
    .btn-accent:active{transform:translateY(1px)}
    .text-muted{color:var(--muted)}
    .input{width:100%;padding:.6rem .75rem;border-radius:.75rem;background:#1e1e1e;border:1px solid rgba(144,144,144,.35);outline:none}
    .input:focus{outline:2px solid var(--accent)}
    /* Segmented role switch */
    .seg { display:flex; background:#1b1b1b; border:1px solid rgba(144,144,144,.35); border-radius:9999px; padding:4px; gap:4px; }
    .seg button { flex:1; padding:.5rem .75rem; border-radius:9999px; font-weight:600; color:var(--light); background:transparent; border:none; cursor:pointer; }
    .seg button.active { background:var(--accent); color:var(--bg); box-shadow:0 0 10px rgba(151,251,87,.35) inset; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <main class="w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-2">
      <h1 class="text-3xl font-bold tracking-tight"><span class="accent-text">Iron</span>Pump</h1>
    </div>
    <p class="text-sm text-muted text-center mb-6">Choose your role and log in to your account.</p>

    <section class="panel rounded-2xl p-6">
      <!-- Role choice -->
      <div class="mb-4">
        <label class="block text-sm mb-2">Log in as</label>
        <div class="seg" role="tablist" aria-label="Login role">
          <button type="button" id="roleClient" class="active" aria-selected="true" role="tab">Client</button>
          <button type="button" id="roleTrainer" aria-selected="false" role="tab">Trainer</button>
        </div>
        <p class="text-xs text-muted mt-2" id="roleHint">You’re logging in as <span class="accent-text font-semibold">Client</span>.</p>
      </div>

      <!-- Form -->
      <form id="loginForm" class="space-y-4" novalidate>
        <div>
          <label for="email" class="block text-sm mb-1">Email</label>
          <input id="email" type="email" required class="input" placeholder="you@example.com" autocomplete="email"/>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label for="password" class="block text-sm">Password</label>
            <button type="button" id="forgotBtn" class="text-xs accent-text hover:underline">Forgot password?</button>
          </div>
          <div class="relative">
            <input id="password" type="password" required class="input pr-10" placeholder="••••••••" autocomplete="current-password"/>
            <button type="button" id="togglePw" class="absolute right-2 top-1/2 -translate-y-1/2 p-1 text-muted" aria-label="Toggle password">
              <i data-feather="eye"></i>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between">
          <label class="inline-flex items-center gap-2 text-sm">
            <input id="remember" type="checkbox" class="accent-[var(--accent)]">
            <span>Remember me</span>
          </label>
          <!-- Conditional register links -->
          <a href="signup.html" id="registerClient" class="text-sm accent-text hover:underline">Are you a client? Register here</a>
          <a href="signup-trainer.html" id="registerTrainer" class="text-sm accent-text hover:underline hidden">Are you a trainer? Register here</a>
        </div>

        <button id="loginBtn" class="w-full btn-accent py-2.5 rounded-lg font-medium flex items-center justify-center gap-2">
          <i data-feather="log-in" class="w-4 h-4"></i><span>Log In</span>
        </button>

        <!-- Status -->
        <p id="status" class="text-sm mt-2 h-5"></p>
      </form>
    </section>

    <p class="text-center text-xs text-muted mt-4">
      By continuing you agree to our Terms & Privacy Policy.
    </p>
  </main>

  <!-- App logic (modular Firebase v12) -->
  <script type="module">
    feather.replace();

    import { auth, db } from './firebase-init.js';
    import {
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

    // ---------- Role UI ----------
    let chosenRole = sessionStorage.getItem('ironpump_chosenRole') || 'client';
    const roleClientBtn = document.getElementById('roleClient');
    const roleTrainerBtn = document.getElementById('roleTrainer');
    const roleHint = document.getElementById('roleHint');
    const regClient = document.getElementById('registerClient');
    const regTrainer = document.getElementById('registerTrainer');

    function renderRoleUI() {
      const isClient = chosenRole === 'client';
      roleClientBtn.classList.toggle('active', isClient);
      roleTrainerBtn.classList.toggle('active', !isClient);
      roleClientBtn.setAttribute('aria-selected', String(isClient));
      roleTrainerBtn.setAttribute('aria-selected', String(!isClient));
      roleHint.innerHTML = `You’re logging in as <span class="accent-text font-semibold">${isClient ? 'Client' : 'Trainer'}</span>.`;
      regClient.classList.toggle('hidden', !isClient);
      regTrainer.classList.toggle('hidden', isClient);
    }
    roleClientBtn.addEventListener('click', () => { chosenRole = 'client'; sessionStorage.setItem('ironpump_chosenRole', chosenRole); renderRoleUI(); });
    roleTrainerBtn.addEventListener('click', () => { chosenRole = 'trainer'; sessionStorage.setItem('ironpump_chosenRole', chosenRole); renderRoleUI(); });
    renderRoleUI();

    // ---------- Role helpers ----------
    const DEBUG = true;

    async function fetchUserRoles(uid) {
      try {
        const snap = await getDoc(doc(db, 'users', uid));
        if (!snap.exists()) return { roles: [], raw: null };
        const data = snap.data() || {};
        let roles = Array.isArray(data.roles)
          ? data.roles.map(r => String(r || '').toLowerCase())
          : data.role ? [String(data.role).toLowerCase()] : [];
        roles = Array.from(new Set(roles.filter(r => r === 'client' || r === 'trainer')));
        if (DEBUG) console.log('[login] fetchUserRoles', { uid, roles, data });
        return { roles, raw: data };
      } catch (e) {
        console.error('[login] fetchUserRoles error:', e);
        return { roles: [], raw: null };
      }
    }

    function userHasRole(roles, role) {
      if (!roles || roles.length === 0) return role === 'client'; // legacy default
      return roles.includes(role);
    }

    function routeFor(role) {
      const next = new URLSearchParams(location.search).get('next');
      return role === 'trainer' ? (next || 'trainer-dashboard.html') : (next || 'index.html');
    }

    async function routeAfterLogin(uid) {
      const { roles } = await fetchUserRoles(uid);
      if (userHasRole(roles, chosenRole)) {
        if (DEBUG) console.log('[login] routing as', chosenRole);
        location.replace(routeFor(chosenRole));
      } else {
        showError(`You don't have ${chosenRole} access.`);
      }
    }

    // ---------- UI helpers ----------
    const emailEl = document.getElementById('email');
    const pwEl = document.getElementById('password');
    const rememberEl = document.getElementById('remember');
    const statusEl = document.getElementById('status');
    const loginBtn = document.getElementById('loginBtn');

    function setLoading(isLoading){
      loginBtn.disabled = isLoading;
      loginBtn.style.opacity = isLoading ? 0.7 : 1;
      statusEl.textContent = isLoading ? 'Signing in…' : '';
      statusEl.style.color = isLoading ? 'var(--muted)' : '';
    }
    function showError(msg){ statusEl.textContent = msg; statusEl.style.color = '#ff6b6b'; }
    function showSuccess(msg){ statusEl.textContent = msg; statusEl.style.color = 'var(--accent)'; }

    // Toggle password visibility
    document.getElementById('togglePw').addEventListener('click', () => {
      const t = pwEl.type === 'password' ? 'text' : 'password';
      pwEl.type = t;
      const icon = t === 'password' ? 'eye' : 'eye-off';
      document.querySelector('#togglePw i').setAttribute('data-feather', icon);
      feather.replace();
    });

    // Forgot password
    document.getElementById('forgotBtn').addEventListener('click', async () => {
      const email = (emailEl.value || '').trim();
      if (!email) { showError('Enter your email first.'); return; }
      try{
        await sendPasswordResetEmail(auth, email);
        showSuccess('Password reset email sent.');
      }catch(err){
        showError(err.message || 'Error sending reset email.');
      }
    });

    // Auth state
    onAuthStateChanged(auth, async (u) => {
      if (u) {
        if (DEBUG) console.log('[login] onAuthStateChanged:', u.uid);
        await routeAfterLogin(u.uid);
      }
    });

    // Login submit
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = (emailEl.value || '').trim();
      const pass  = pwEl.value || '';

      if (!email || !pass) { showError('Please fill in email and password.'); return; }

      try{
        setLoading(true);
        await setPersistence(auth, rememberEl.checked ? browserLocalPersistence : browserSessionPersistence);
        const { user } = await signInWithEmailAndPassword(auth, email, pass);
        await routeAfterLogin(user.uid);
      }catch(err){
        showError(err.message || 'Authentication error.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
