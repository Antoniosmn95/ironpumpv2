<script type="module">
  feather.replace();

  import { app, auth as exportedAuth, db as exportedDb } from './firebase-init.js';
  import {
    getAuth, setPersistence,
    browserLocalPersistence, browserSessionPersistence,
    signInWithEmailAndPassword, sendPasswordResetEmail,
    onAuthStateChanged, reload, signOut
  } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
  import {
    getFirestore, doc, getDoc, setDoc, serverTimestamp
  } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';

  const auth = exportedAuth || getAuth(app);
  const db   = exportedDb   || getFirestore(app);

  const $ = (id) => document.getElementById(id);
  const emailEl = $('email');
  const pwEl = $('password');
  const rememberEl = $('remember');
  const statusEl = $('status');
  const loginBtn = $('loginBtn');

  const routeFor = (role) => role === 'trainer'
    ? 'trainer-dashboard.html'
    : 'client-dashboard.html';

  function friendlyAuthError(err){
    const code = String(err?.code || '');
    if (code.includes('invalid-credential')) return 'Email or password is incorrect.';
    if (code.includes('user-not-found')) return 'No account found with that email.';
    if (code.includes('wrong-password')) return 'Email or password is incorrect.';
    if (code.includes('too-many-requests')) return 'Too many attempts. Please try again later.';
    if (code.includes('network-request-failed')) return 'Network error. Check your connection.';
    return err?.message || 'Something went wrong. Please try again.';
  }

  // 🔧 NEW: ensure profile exists (bootstrap if missing), return role
  async function ensureUserProfileAndGetRole(user){
    const ref = doc(db,'users', user.uid);
    const snap = await getDoc(ref);

    if (!snap.exists()) {
      await setDoc(ref, {
        role: 'client',
        roles: ['client'],
        email: user.email || '',
        fullName: user.displayName || '',
        photoURL: user.photoURL || '',
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      }, { merge: true });
      try { sessionStorage.setItem('ironpump_lastRole','client'); localStorage.setItem('ironpump_lastRole','client'); } catch {}
      return 'client';
    }

    const data = snap.data() || {};
    const role = Array.isArray(data.roles)
      ? String(data.roles[0] || data.role || 'client').toLowerCase()
      : String(data.role || 'client').toLowerCase();

    const safeRole = (role === 'trainer') ? 'trainer' : 'client';
    try { sessionStorage.setItem('ironpump_lastRole', safeRole); localStorage.setItem('ironpump_lastRole', safeRole); } catch {}
    return safeRole;
  }

  // Email cleanup
  if (emailEl){
    emailEl.addEventListener('input',()=>{ emailEl.value=emailEl.value.replace(/\s+/g,''); });
    emailEl.addEventListener('blur',()=>{ emailEl.value=emailEl.value.trim(); });
  }

  // Password toggle
  $('togglePw').addEventListener('click',()=>{
    const isPassword=pwEl.type==='password';
    pwEl.type=isPassword?'text':'password';
    const icon=isPassword?'eye-off':'eye';
    const iconEl=document.querySelector('#togglePw i');
    if(iconEl){ iconEl.setAttribute('data-feather',icon); feather.replace(); }
  });

  // Forgot password
  $('forgotBtn').addEventListener('click',async()=>{
    const email=emailEl.value.trim();
    statusEl.textContent='';
    if(!email){ statusEl.textContent='Enter your email first.'; return; }
    try{
      await sendPasswordResetEmail(auth,email);
      statusEl.textContent='Password reset email sent.'; statusEl.style.color='var(--accent)';
    }catch(e){
      statusEl.textContent=friendlyAuthError(e); statusEl.style.color='#ff6b6b';
    }
  });

  // Login submit
  $('loginForm').addEventListener('submit',async(e)=>{
    e.preventDefault();
    const email=emailEl.value.trim();
    const pass=pwEl.value;
    if(!email||!pass){ statusEl.textContent='Please fill in email and password.'; return; }
    statusEl.textContent='';
    try{
      loginBtn.disabled=true;
      await setPersistence(auth, rememberEl.checked ? browserLocalPersistence : browserSessionPersistence);
      const cred = await signInWithEmailAndPassword(auth,email,pass);
      const role = await ensureUserProfileAndGetRole(cred.user);       // 🔧 changed
      location.replace(routeFor(role));
    }catch(e){
      console.error('[Auth] signIn failed:',e.code,e.message);
      statusEl.textContent=friendlyAuthError(e); statusEl.style.color='#ff6b6b';
    }finally{
      loginBtn.disabled=false;
    }
  });

  // Already signed in → route out of login (also heals missing profile)
  onAuthStateChanged(auth,async(u)=>{
    if(!u){ document.documentElement.classList.remove("__gate-hide"); return; }
    try{ await reload(u); }catch{}
    try{
      const role = await ensureUserProfileAndGetRole(u);               // 🔧 changed
      location.replace(routeFor(role));
    }catch(_){
      try{ await signOut(auth); }catch{}
      document.documentElement.classList.remove("__gate-hide");
    }
  });
</script>
