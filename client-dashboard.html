<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IronPump — Client Dashboard</title>

  <!-- UI libs -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/feather-icons"></script>

  <!-- PDF libs for month export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <!-- Firebase init + Auth guard -->
  <script type="module" src="firebase-init.js"></script>
  <script type="module" src="auth-guard.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    :root{ --accent:#97FB57; --bg:#121212; --muted:#909090; --light:#F6F2F2; }
    html,body{ height:100%; }
    body{ font-family:'Inter',sans-serif; background:var(--bg); color:var(--light); }
    .panel{ background:#161616; border:1px solid rgba(144,144,144,0.35); }
    .card { background:#171717; border:1px solid rgba(144,144,144,0.35); }
    .card:hover{ background:#1d1d1d; }
    .accent-text{ color:var(--accent); }
    .accent-chip{ background:rgba(151,251,87,0.12); color:var(--accent); border:1px solid rgba(151,251,87,0.45); }
    .btn-accent{ background:var(--accent); color:var(--bg); box-shadow:0 0 12px rgba(151,251,87,0.45), inset 0 0 0 1px rgba(18,18,18,0.4); transition:filter .15s ease, transform .05s ease; }
    .btn-accent:hover{ filter:brightness(0.95); }
    .btn-accent:active{ transform:translateY(1px); }
    .btn-ghost{ background:#232323; color:var(--light); border:1px solid rgba(144,144,144,0.35); }
    .btn-ghost:hover{ background:#2a2a2a; }
    .text-muted{ color:var(--muted); }
    .divider{ border-color:rgba(144,144,144,0.35); }
    .cal-day{ border-radius:.5rem; cursor:default; }
    .cal-day--muted{ color:#666; }
    .cal-day--today{ outline:2px solid rgba(151,251,87,.6); outline-offset:2px; }
    .cal-select{ background:#1e1e1e; border:1px solid rgba(144,144,144,.35); border-radius:.5rem; padding:.35rem .6rem; }
    .cal-select:focus{ outline:2px solid var(--accent); }
    .menu-panel{ background:#1b1b1b; border:1px solid rgba(144,144,144,0.35); border-radius:.6rem; min-width: 180px; }
    .menu-item{ display:flex; align-items:center; gap:.5rem; padding:.55rem .7rem; font-size:.9rem; color:var(--light); }
    .menu-item:hover{ background:#232323; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <!-- Header -->
  <header class="panel text-[var(--light)] p-4 shadow-md border-b divider">
    <div class="container mx-auto flex justify-between items-center">
      <!-- Logo + Title -->
      <div class="flex items-center gap-3">
        <img src="ironpump.png" alt="IronPump" class="w-8 h-8 rounded-md object-contain" />
        <h1 class="text-2xl font-bold tracking-tight">
          <span class="accent-text">Iron</span>Pump
        </h1>
      </div>

      <!-- Right cluster -->
      <div class="flex items-center gap-2 relative">
        <span id="programName" class="hidden text-sm text-muted"></span>

        <!-- Welcome full name + avatar -->
        <div id="welcomeWrap" class="hidden md:flex items-center gap-2 mr-1">
          <img id="userAvatar" src="" alt="Profile" class="w-8 h-8 rounded-full border border-[#2a2a2a] object-cover" />
          <div class="text-sm">
            <span class="text-muted">Welcome, </span><span id="userFullName" class="font-medium">Athlete</span>
          </div>
        </div>

        <!-- Calendar button -->
        <button id="calendarBtn" class="p-2 rounded-full hover:bg-[#1f1f1f] transition" aria-label="Open Calendar">
          <i data-feather="calendar" class="accent-text"></i>
        </button>

        <!-- View Trainers -->
        <a href="trainers-panel.html" class="ml-1 px-3 py-2 rounded-lg btn-accent text-sm hidden sm:inline-block">
          View Trainers
        </a>

        <!-- ▼ dropdown arrow button -->
        <button id="userMenuBtn" class="p-2 rounded-full hover:bg-[#1f1f1f] transition" aria-haspopup="true" aria-expanded="false" aria-controls="userMenu" aria-label="Open menu">
          <i data-feather="chevron-down"></i>
        </button>

        <!-- Menu panel -->
        <div id="userMenu" class="menu-panel absolute right-0 top-12 hidden z-50 shadow-lg">
          <a href="profile-client.html" class="menu-item" id="menuProfile">
            <i data-feather="user" class="w-4 h-4"></i><span>View Profile</span>
          </a>
          <button class="menu-item w-full text-left" id="menuSignOut">
            <i data-feather="log-out" class="w-4 h-4"></i><span>Sign Out</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-grow container mx-auto p-4">
    <div class="grid grid-cols-1 gap-4">
      <!-- Day selector -->
      <div class="panel p-6 rounded-xl shadow-md">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-semibold">Select Your Workout Day</h2>
          <span id="authHint" class="text-sm text-muted"></span>
        </div>
        <div id="dayGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
          <!-- Empty state -->
          <div class="card p-4 rounded-lg text-sm text-muted col-span-full">
            No active program found. Ask your trainer to assign one.
          </div>
        </div>
      </div>

      <!-- Recent Activity -->
      <div class="panel p-6 rounded-xl shadow-md">
        <h2 class="text-xl font-semibold mb-4">Recent Activity</h2>
        <div id="recentActivity" class="space-y-3">
          <div class="flex items-center p-3 card rounded-lg" id="recentEmpty">
            <div class="p-2 rounded-full mr-3 accent-chip">
              <i data-feather="activity" class="accent-text"></i>
            </div>
            <div>
              <p class="font-medium">No workouts completed yet</p>
              <p class="text-sm text-muted">Start your first workout today!</p>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Calendar Modal -->
  <div id="calendarModal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden z-50">
    <div class="panel rounded-xl p-6 w-full max-w-3xl mx-4">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-semibold">Workout Calendar</h3>
        <button id="closeCalendar" class="text-muted hover:text-[var(--light)]" aria-label="Close Calendar">
          <i data-feather="x"></i>
        </button>
      </div>

      <div class="flex flex-wrap items-center gap-2 mb-4">
        <button id="prevMonth" class="p-2 rounded-full btn-ghost" aria-label="Prev">
          <i data-feather="chevron-left"></i>
        </button>
        <select id="monthSelect" class="cal-select" aria-label="Select month"></select>
        <select id="yearSelect" class="cal-select" aria-label="Select year"></select>
        <button id="nextMonth" class="p-2 rounded-full btn-ghost" aria-label="Next">
          <i data-feather="chevron-right"></i>
        </button>
        <button id="todayBtn" class="ml-auto px-3 py-2 rounded-lg btn-ghost">Today</button>
        <button id="exportMonthPDF" class="px-3 py-2 rounded-lg btn-accent">Export Month PDF</button>
      </div>

      <div class="grid grid-cols-7 gap-1 mb-2 text-muted text-xs font-medium">
        <div class="text-center py-1">Sun</div><div class="text-center py-1">Mon</div><div class="text-center py-1">Tue</div>
        <div class="text-center py-1">Wed</div><div class="text-center py-1">Thu</div><div class="text-center py-1">Fri</div><div class="text-center py-1">Sat</div>
      </div>
      <div id="calendarGrid" class="grid grid-cols-7 gap-1"></div>
    </div>
  </div>

  <!-- ===== Page JS ===== -->
  <script type="module">
    // -------------- Access gate --------------
    await window.AuthGuard?.requireRole?.('client');

    // -------------- Icons --------------
    try { feather.replace(); } catch {}

    // -------------- Header dropdown --------------
    const userMenuBtn = document.getElementById('userMenuBtn');
    const userMenu = document.getElementById('userMenu');
    function setMenu(open){
      if (open) {
        userMenu.classList.remove('hidden');
        userMenuBtn.setAttribute('aria-expanded','true');
      } else {
        userMenu.classList.add('hidden');
        userMenuBtn.setAttribute('aria-expanded','false');
      }
    }
    userMenuBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const open = userMenu.classList.contains('hidden');
      setMenu(open);
    });
    document.addEventListener('click', (e)=>{
      if (!userMenu.contains(e.target) && e.target !== userMenuBtn) setMenu(false);
    });
    document.addEventListener('keydown', (e)=>{ if(e.key==='Escape'){ setMenu(false); }});

    // -------------- Sign out (AuthGuard) --------------
    const signOutBtn = document.getElementById('menuSignOut');
    signOutBtn?.addEventListener('click', async (e) => {
      e.preventDefault();
      e.stopPropagation();
      try {
        signOutBtn.disabled = true;
        await window.AuthGuard?.signOut?.();
      } catch (err) {
        console.error('[SignOut] failed:', err);
        signOutBtn.disabled = false;
        alert('Could not sign out. Please try again.');
      }
    });

    // -------------- Avatar defaults (gender-based) --------------
    const DEFAULT_MAN   = 'man.png';    // adjust path if needed
    const DEFAULT_WOMAN = 'woman.png';  // adjust path if needed
    const genderDefault = (g)=> (String(g||'male').toLowerCase()==='female' ? DEFAULT_WOMAN : DEFAULT_MAN);

    // -------------- Welcome header wiring --------------
    const welcomeWrap = document.getElementById('welcomeWrap');
    const fullNameEl  = document.getElementById('userFullName');
    const avatarEl    = document.getElementById('userAvatar');

    // Robust profile loader: Firestore first, then Auth; fallback to gender default avatar.
    import { app, auth as exportedAuth, db as exportedDb } from './firebase-init.js';
    import { getAuth, onAuthStateChanged, reload } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
    import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';

    const auth = exportedAuth || getAuth(app);
    const db   = exportedDb   || getFirestore(app);

    async function loadFirestoreProfile(uid){
      try{
        const snap = await getDoc(doc(db,'users',uid));
        return snap.exists() ? (snap.data()||null) : null;
      }catch(e){
        console.warn('[Profile] Firestore read failed:', e);
        return null;
      }
    }

    // Some installs use AuthGuard.getProfile; we’ll call it too if available,
    // but prefer Firestore directly to avoid race conditions.
    async function loadProfile(uid){
      const byFs = await loadFirestoreProfile(uid);
      if (byFs) return byFs;
      try{
        const byGuard = await window.AuthGuard?.getProfile?.();
        if (byGuard) return byGuard;
      }catch{}
      return null;
    }

    onAuthStateChanged(auth, async (user)=>{
      if (!user){
        welcomeWrap.classList.add('hidden');
        return;
      }
      try{ await reload(user); }catch{}

      // Load profile
      const p = await loadProfile(user.uid);

      const displayName =
        (p?.fullName && p.fullName.trim()) ? p.fullName :
        (user.displayName && user.displayName.trim()) ? user.displayName :
        user.email || 'Athlete';

      const gender = (p?.gender || '').toLowerCase();
      const defaultPhoto = genderDefault(gender);

      const photo =
        (p?.photoURL && String(p.photoURL).trim()) ? p.photoURL :
        (user.photoURL && String(user.photoURL).trim()) ? user.photoURL :
        defaultPhoto;

      fullNameEl.textContent = displayName;
      avatarEl.src = photo;
      avatarEl.onerror = () => { avatarEl.onerror = null; avatarEl.src = defaultPhoto; };

      welcomeWrap.classList.remove('hidden');
      try { feather.replace(); } catch {}
    });

    // -------------- Calendar (UI only) --------------
    const calendarBtn = document.getElementById('calendarBtn');
    const calendarModal = document.getElementById('calendarModal');
    const closeCalendar = document.getElementById('closeCalendar');
    const monthSelect = document.getElementById('monthSelect');
    const yearSelect  = document.getElementById('yearSelect');
    const prevMonthBtn = document.getElementById('prevMonth');
    const nextMonthBtn = document.getElementById('nextMonth');
    const todayBtn     = document.getElementById('todayBtn');
    const exportMonthBtn = document.getElementById('exportMonthPDF');
    const calGrid      = document.getElementById('calendarGrid');

    const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    (function initSelectors(){
      MONTHS.forEach((m,i)=> {
        const opt = document.createElement('option');
        opt.value = i; opt.textContent = m; monthSelect.appendChild(opt);
      });
      const currentYear = new Date().getFullYear();
      for(let y=currentYear-5; y<=currentYear+5; y++){
        const opt = document.createElement('option');
        opt.value = y; opt.textContent = y; yearSelect.appendChild(opt);
      }
    })();

    const today = new Date();
    let viewYear  = today.getFullYear();
    let viewMonth = today.getMonth();

    function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
    function startWeekday(y,m){ return new Date(y, m, 1).getDay(); }

    function renderCalendar(){
      monthSelect.value = viewMonth; yearSelect.value = viewYear;
      const totalDays = daysInMonth(viewYear, viewMonth);
      const startPad  = startWeekday(viewYear, viewMonth);
      calGrid.innerHTML = '';

      // leading
      const prevMonth = (viewMonth - 1 + 12) % 12;
      const prevYear  = viewMonth === 0 ? viewYear - 1 : viewYear;
      const prevTotal = daysInMonth(prevYear, prevMonth);
      for(let i=0; i<startPad; i++){
        const d = document.createElement('div');
        d.className = 'cal-day text-center py-2 cal-day--muted';
        d.textContent = prevTotal - startPad + 1 + i;
        calGrid.appendChild(d);
      }

      // month days
      for(let day=1; day<=totalDays; day++){
        const cell = document.createElement('div');
        cell.className = 'cal-day text-center py-2 hover:bg-[#1f1f1f]';
        cell.textContent = day;
        const isToday = (viewYear===today.getFullYear() && viewMonth===today.getMonth() && day===today.getDate());
        if(isToday) cell.classList.add('cal-day--today');
        calGrid.appendChild(cell);
      }

      // trailing
      const filled = startPad + totalDays;
      const trailing = (7 - (filled % 7)) % 7;
      for(let i=0; i<trailing; i++){
        const d = document.createElement('div');
        d.className = 'cal-day text-center py-2 cal-day--muted';
        d.textContent = i+1;
        calGrid.appendChild(d);
      }
    }

    const openCal = () => { calendarModal.classList.remove('hidden'); renderCalendar(); }
    const closeCal = () => { calendarModal.classList.add('hidden'); }

    calendarBtn.addEventListener('click', openCal);
    closeCalendar.addEventListener('click', closeCal);
    calendarModal.addEventListener('click', (e)=>{ if(e.target === calendarModal) closeCal(); });

    prevMonthBtn.addEventListener('click', () => { viewMonth--; if(viewMonth < 0){ viewMonth = 11; viewYear--; } renderCalendar(); });
    nextMonthBtn.addEventListener('click', () => { viewMonth++; if(viewMonth > 11){ viewMonth = 0; viewYear++; } renderCalendar(); });
    todayBtn.addEventListener('click', () => { viewYear = new Date().getFullYear(); viewMonth = new Date().getMonth(); renderCalendar(); });
    monthSelect.addEventListener('change', (e) => { viewMonth = Number(e.target.value); renderCalendar(); });
    yearSelect.addEventListener('change',  (e) => { viewYear  = Number(e.target.value);  renderCalendar(); });

    // Export Month (empty table)
    exportMonthBtn.addEventListener('click', () => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFontSize(18);
      doc.text(`Workout Summary — ${MONTHS[viewMonth]} ${viewYear}`, 105, 15, null, null, 'center');
      doc.setFontSize(12);
      doc.text(`Sessions: 0`, 14, 25);
      doc.autoTable({ startY: 30, head: [['Date','Details']], body: [['—','No workouts recorded this month']], theme: 'grid', headStyles: { fillColor:[151,251,87], textColor:18 } });
      const fname = `ironpump-month-${viewYear}-${String(viewMonth+1).padStart(2,'0')}.pdf`;
      doc.save(fname);
    });
  </script>
</body>
</html>
