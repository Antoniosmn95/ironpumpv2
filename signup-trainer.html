<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Trainer Sign Up — IronPump</title>

  <!-- UI -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/feather-icons"></script>

  <!-- Firebase (initialized in your local file) -->
  <script type="module" src="firebase-init.js"></script>

  <!-- Flatpickr (optional) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root{
      --accent:#97FB57; --bg:#121212; --muted:#909090; --light:#F6F2F2;
      --base-fs:14px;
    }

    html,body{ height:100%; }
    body{
      font-family:'Inter',sans-serif; background:var(--bg); color:var(--light);
      padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
      font-size: var(--base-fs); line-height: 1.34;
    }
    @media (max-height: 800px){ body{ font-size:13px; } }
    @media (max-height: 680px){ body{ font-size:12px; } }
    @media (max-height: 600px){ body{ font-size:11.5px; } }

    .panel{ background:#161616; border:1px solid rgba(144,144,144,.35); }
    .accent-text{ color:var(--accent); }
    .text-muted{ color:var(--muted); }

    .btn-accent{
      background:var(--accent); color:var(--bg);
      box-shadow:0 0 8px rgba(151,251,87,.35), inset 0 0 0 1px rgba(18,18,18,.4);
      transition:filter .15s ease, transform .05s ease;
    }
    .btn-accent:hover{ filter:brightness(.95); }
    .btn-ghost{ background:#232323; color:var(--light); border:1px solid rgba(144,144,144,.35); }

    .input{
      width:100%; padding:.45rem .6rem; border-radius:.6rem;
      background:#1e1e1e; border:1px solid rgba(144,144,144,.35); outline:none;
      min-height:34px;
    }
    .input:focus{ outline:2px solid var(--accent); }

    .grid-2{ display:grid; grid-template-columns:1fr; gap:.65rem; }
    @media(min-width: 1150px){ .grid-2{ grid-template-columns:1fr 1fr; } }

    .title{ font-size:1.5rem; }
    @media(min-width:768px){ .title{ font-size:1.7rem; } }

    .spinner{
      width:14px; height:14px; border-radius:9999px;
      border:2px solid rgba(255,255,255,.25); border-top-color:rgba(255,255,255,.9);
      animation:spin .8s linear infinite; display:inline-block; vertical-align:-2px; margin-right:.4rem;
    }
    @keyframes spin{ to{ transform:rotate(360deg);} }

    /* Native date input */
    input[type="date"]{ color-scheme: dark; accent-color: var(--accent); }
    input[type="date"]::-webkit-calendar-picker-indicator{
      opacity: 1;
      background: url("data:image/svg+xml;utf8,\
      <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23909090' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>\
        <rect x='3' y='4' width='18' height='18' rx='2' ry='2'/>\
        <line x1='16' y1='2' x2='16' y2='6'/>\
        <line x1='8' y1='2' x2='8' y2='6'/>\
        <line x1='3' y1='10' x2='21' y2='10'/>\
      </svg>") no-repeat center / 18px 18px;
      cursor: pointer;
    }
    input[type="date"]:focus::-webkit-calendar-picker-indicator{
      background-image: url("data:image/svg+xml;utf8,\
      <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2397FB57' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>\
        <rect x='3' y='4' width='18' height='18' rx='2' ry='2'/>\
        <line x1='16' y1='2' x2='16' y2='6'/>\
        <line x1='8' y1='2' x2='8' y2='6'/>\
        <line x1='3' y1='10' x2='21' y2='10'/>\
      </svg>");
    }

    /* Welcome overlay */
    #welcomeOverlay{
      position: fixed; inset: 0; background: rgba(0,0,0,.75);
      display: none; align-items: center; justify-content: center; z-index: 9999;
      backdrop-filter: blur(2px); animation: fadeIn .15s ease-out;
    }
    .welcome-card{
      background:#151515; border:1px solid rgba(144,144,144,.35);
      border-radius: 1rem; padding: 1.25rem 1.4rem; text-align: center; width: 90%; max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
      animation: pop .18s ease-out;
    }
    .welcome-logo{
      width: 72px; height: 72px; border-radius: .75rem; object-fit: contain;
      border:1px solid rgba(144,144,144,.35); background:#111; margin: 0 auto .65rem;
    }
    .welcome-spinner{
      width: 22px; height: 22px; border-width: 3px; margin: .35rem auto 0;
      border-radius: 9999px; border: 3px solid rgba(255,255,255,.22); border-top-color: #fff; animation: spin .8s linear infinite;
    }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
    @keyframes pop { from { transform: translateY(6px) scale(.98); opacity:.9 } to { transform: translateY(0) scale(1); opacity:1 } }
  </style>
</head>
<body class="min-h-[100svh] flex items-start justify-center p-3 md:p-4">
  <main class="w-full max-w-2xl">
    <div class="mb-3 text-center">
      <h1 class="title font-bold tracking-tight"><span class="accent-text">Iron</span>Pump</h1>
      <p class="text-xs text-muted mt-1">Trainer registration</p>
    </div>

    <section class="panel rounded-xl p-3.5 md:p-4">
      <form id="signupForm" class="space-y-3.5" novalidate>
        <!-- Account -->
        <div class="grid-2">
          <div>
            <label for="fullName" class="block text-xs mb-1">Full Name</label>
            <input id="fullName" type="text" required
                   pattern="^[A-Za-z\u0600-\u06FF\s]{2,}$"
                   title="Only letters (Arabic/Latin) and spaces"
                   class="input" placeholder="Your full name" autocomplete="name"/>
          </div>
          <div>
            <label for="email" class="block text-xs mb-1">Email</label>
            <input id="email" type="email" required
                   autocapitalize="none" autocomplete="email" spellcheck="false" autocorrect="off"
                   class="input" placeholder="coach@example.com"/>
          </div>

          <div class="relative">
            <label for="password" class="block text-xs mb-1">Password</label>
            <div class="relative">
              <input id="password" type="password" required minlength="6" pattern="^\S+$"
                     class="input pr-9" placeholder="••••••••" autocomplete="new-password"/>
              <button type="button" id="togglePw"
                      class="absolute right-1.5 top-1/2 -translate-y-1/2 p-1 text-muted"
                      aria-label="Toggle password" style="line-height:0;">
                <i data-feather="eye" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <div>
            <label for="password2" class="block text-xs mb-1">Confirm Password</label>
            <input id="password2" type="password" required pattern="^\S+$"
                   class="input" placeholder="Repeat password" autocomplete="new-password"/>
          </div>

          <div>
            <label for="dob" class="block text-xs mb-1">Date of Birth</label>
            <input id="dob" type="date" class="input" required
                   min="1900-01-01" placeholder="YYYY-MM-DD"/>
          </div>
        </div>

        <!-- Photo -->
        <div>
          <label for="photo" class="block text-xs mb-1">Profile Photo</label>
          <input id="photo" type="file" accept="image/*" class="input"/>
          <p class="text-[11px] text-muted mt-1">Optional. JPG/PNG up to 5 MB.</p>
        </div>

        <!-- Contact & Locale -->
        <div class="grid-2">
          <div>
            <label for="phone" class="block text-xs mb-1">Phone</label>
            <input id="phone" type="tel" inputmode="tel" maxlength="17"
                   pattern="^\+?[0-9][0-9\s\-]{5,14}$"
                   title="Digits only (6–15), spaces and - allowed, optional + at start"
                   class="input" placeholder="+961 71 234 567"/>
          </div>
          <div>
            <label for="country" class="block text-xs mb-1">Country</label>
            <select id="country" required class="input">
              <option value="" selected disabled>Select Country</option>
              <option value="Lebanon">🇱🇧 Lebanon</option>
              <option value="Saudi Arabia">🇸🇦 Saudi Arabia</option>
              <option value="United Arab Emirates">🇦🇪 United Arab Emirates</option>
              <option value="Qatar">🇶🇦 Qatar</option>
              <option value="Kuwait">🇰🇼 Kuwait</option>
              <option value="Bahrain">🇧🇭 Bahrain</option>
              <option value="Oman">🇴🇲 Oman</option>
              <option value="Yemen">🇾🇪 Yemen</option>
              <option value="Jordan">🇯🇴 Jordan</option>
              <option value="Syria">🇸🇾 Syria</option>
              <option value="Iraq">🇮🇶 Iraq</option>
              <option value="Egypt">🇪🇬 Egypt</option>
              <option value="Sudan">🇸🇩 Sudan</option>
              <option value="Morocco">🇲🇦 Morocco</option>
              <option value="Algeria">🇩🇿 Algeria</option>
              <option value="Tunisia">🇹🇳 Tunisia</option>
              <option value="Libya">🇱🇾 Libya</option>
              <option value="Mauritania">🇲🇷 Mauritania</option>
              <option value="Somalia">🇸🇴 Somalia</option>
              <option value="Palestine">🇵🇸 Palestine</option>
              <option value="Comoros">🇰🇲 Comoros</option>
              <option value="Djibouti">🇩🇯 Djibouti</option>
            </select>
          </div>
          <div>
            <label for="languages" class="block text-xs mb-1">Languages (comma-separated)</label>
            <input id="languages" type="text"
                   pattern="^[A-Za-z\u0600-\u06FF,\s]+$"
                   title="Only letters (Arabic/Latin), commas and spaces"
                   class="input" placeholder="English, Arabic"/>
          </div>
          <div>
            <label for="org" class="block text-xs mb-1">Gym / Organization</label>
            <input id="org" type="text" class="input" placeholder="Your gym or company"/>
          </div>
        </div>

        <!-- Trainer details -->
        <div class="grid-2">
          <div>
            <label for="years" class="block text-xs mb-1">Years of Experience</label>
            <input id="years" type="number" min="0" max="80" step="1" inputmode="numeric"
                   class="input" placeholder="e.g. 5"/>
          </div>
          <div>
            <label for="accepting" class="block text-xs mb-1">Accepting New Clients</label>
            <select id="accepting" class="input">
              <option value="yes" selected>Yes</option>
              <option value="no">No</option>
            </select>
          </div>
          <div>
            <label for="specialties" class="block text-xs mb-1">Specialties (comma-separated)</label>
            <input id="specialties" type="text" class="input" placeholder="Hypertrophy, Fat loss, Powerlifting"/>
          </div>
          <div>
            <label for="certs" class="block text-xs mb-1">Certifications</label>
            <input id="certs" type="text" class="input" placeholder="NASM CPT, CSCS"/>
          </div>
        </div>

        <div>
          <label for="bio" class="block text-xs mb-1">Bio</label>
          <textarea id="bio" rows="4" class="input" placeholder="Short introduction, coaching style, achievements…"></textarea>
        </div>

        <div class="grid-2">
          <div>
            <label for="social" class="block text-xs mb-1">Website / Instagram (optional)</label>
            <input id="social" type="url" class="input" placeholder="https://instagram.com/yourhandle"/>
          </div>
          <div>
            <label for="trainerCode" class="block text-xs mb-1">Trainer Invite Code (optional)</label>
            <input id="trainerCode" type="text" class="input" placeholder="For linking clients later"/>
          </div>
        </div>

        <button id="createBtn" class="w-full btn-accent py-2 rounded-lg font-medium flex items-center justify-center gap-2">
          <i data-feather="user-plus" class="w-4 h-4"></i><span>Create Trainer Account</span>
        </button>

        <p id="status" class="text-[12px] mt-1 h-4"></p>

        <p class="text-xs text-center mt-1.5">
          Already registered?
          <a href="login.html" class="accent-text hover:underline">Log in</a>
        </p>
      </form>
    </section>

    <p class="text-[11px] text-center text-muted mt-3">
      By registering you agree to our Terms & Privacy Policy.
    </p>
  </main>

  <!-- Welcome overlay (shown after signup) -->
  <div id="welcomeOverlay" aria-hidden="true">
    <div class="welcome-card">
      <img src="ironpump.png" alt="IronPump" class="welcome-logo">
      <h3 class="text-lg font-semibold mb-1">Welcome to <span class="accent-text">Iron</span>Pump</h3>
      <p class="text-sm text-muted">We’re setting up your trainer dashboard…</p>
      <div class="welcome-spinner" role="status" aria-label="Loading"></div>
    </div>
  </div>

  <script type="module">
    feather.replace();

    import { app, auth as exportedAuth, db as exportedDb } from './firebase-init.js';
    import { getAuth, createUserWithEmailAndPassword, updateProfile, onAuthStateChanged, reload } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
    import { getFirestore, doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';
    import { getStorage, ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-storage.js';

    // Singletons
    const auth    = exportedAuth || getAuth(app);
    const db      = exportedDb   || getFirestore(app);
    const storage = getStorage(app);

    // Prevent auth state auto-redirect during the overlay
    const JUST_KEY = 'ironpump_trainer_justSignedUp';

    // Helpers
    const $ = (id) => document.getElementById(id);
    const statusEl = $('status');

    function setLoading(b){
      const btn = $('createBtn');
      btn.disabled = b; btn.style.opacity = b ? .7 : 1;
      statusEl.textContent = b ? 'Creating trainer account…' : '';
      statusEl.style.color = b ? 'var(--muted)' : '';
    }
    function showError(m){ statusEl.textContent = m; statusEl.style.color = '#ff6b6b'; }

    // Niceties / sanitizers
    $('email').addEventListener('input', e => { e.target.value = e.target.value.replace(/\s+/g, ''); });
    $('email').addEventListener('blur',  e => { e.target.value = e.target.value.trim(); });
    $('phone').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^\d+\s-]/g, '').replace(/(?!^)\+/g, '');
    });
    $('fullName').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^A-Za-z\u0600-\u06FF\s]/g, '');
    });
    $('languages').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^A-Za-z\u0600-\u06FF,\s]/g, '');
    });

    // Password eye toggle
    $('togglePw')?.addEventListener('click', () => {
      const pw = $('password');
      const isPassword = pw.type === 'password';
      pw.type = isPassword ? 'text' : 'password';
      const icon = $('togglePw').querySelector('i');
      if (icon){ icon.setAttribute('data-feather', isPassword ? 'eye-off' : 'eye'); feather.replace(); }
    });

    // Password match
    function syncPasswordMatch(){
      const p1 = $('password').value;
      const p2 = $('password2');
      if (p2.value && p1 !== p2.value) p2.setCustomValidity('Passwords do not match.');
      else p2.setCustomValidity('');
    }
    $('password').addEventListener('input', syncPasswordMatch);
    $('password2').addEventListener('input', syncPasswordMatch);

    // DoB max = today
    (() => { const d = $('dob'); if (d) d.max = new Date().toISOString().slice(0,10); })();

    // If already signed in (fresh visit) and not just-signed-up → go to trainer dashboard
    onAuthStateChanged(auth, async (u) => {
      if (!u) return;
      try { await reload(u); } catch {}
      if (sessionStorage.getItem(JUST_KEY) === '1') return; // allow overlay flow
      window.location.replace('trainer-dashboard.html');
    });

    // Submit → create trainer with role=trainer, show overlay, redirect
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      // Trim fields
      ['fullName','email','phone','languages','org','specialties','certs','bio','social','trainerCode']
        .forEach(id => { const el = $(id); if (el && typeof el.value === 'string') el.value = el.value.trim(); });

      syncPasswordMatch();
      if (!e.target.checkValidity()) {
        e.target.reportValidity();
        showError('Please fix the highlighted fields.');
        return;
      }

      const fullName   = $('fullName').value;
      const email      = $('email').value;
      const password   = $('password').value;
      const password2  = $('password2').value;
      const phone      = $('phone').value;
      const country    = $('country').value;
      const languages  = $('languages').value;
      const org        = $('org').value;
      const years      = Number($('years').value || 0);
      const accepting  = $('accepting').value === 'yes';
      const specialties= $('specialties').value;
      const certs      = $('certs').value;
      const bio        = $('bio').value;
      const social     = $('social').value;
      const trainerCode= $('trainerCode').value;
      const dob        = $('dob').value;
      const photoFile  = $('photo').files[0];

      if (password !== password2) { showError('Passwords do not match.'); return; }
      if (password.length < 6)   { showError('Password must be at least 6 characters.'); return; }

      try {
        setLoading(true);

        // 1) Auth user
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        const uid = cred.user.uid;

        // 2) Optional photo upload
        let photoURL = '';
        if (photoFile) {
          if (photoFile.size > 5 * 1024 * 1024) throw new Error('Image too large (max 5 MB).');
          const r = ref(storage, `users/${uid}/profile.jpg`);
          await uploadBytes(r, photoFile, { contentType: photoFile.type || 'image/jpeg' });
          photoURL = await getDownloadURL(r);
        }

        // 3) Update Auth profile
        await updateProfile(cred.user, { displayName: fullName, photoURL: photoURL || null });

        // 4) Create Firestore user doc with role: 'trainer'
        await setDoc(doc(db, 'users', uid), {
          role: 'trainer',
          email,
          fullName,
          phone,
          country,
          dateOfBirth: dob,
          languages: languages ? languages.split(',').map(s=>s.trim()).filter(Boolean) : [],
          organization: org,
          yearsExperience: years,
          acceptingNewClients: accepting,
          specialties: specialties ? specialties.split(',').map(s=>s.trim()).filter(Boolean) : [],
          certifications: certs ? certs.split(',').map(s=>s.trim()).filter(Boolean) : [],
          bio,
          social: social || '',
          trainerCode: trainerCode || '',
          photoURL: photoURL || '',
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        }, { merge: true });

        // 5) Show overlay & redirect
        sessionStorage.setItem(JUST_KEY, '1');
        const overlay = document.getElementById('welcomeOverlay');
        overlay.style.display = 'flex';
        setTimeout(() => {
          sessionStorage.removeItem(JUST_KEY);
          window.location.replace('trainer-dashboard.html');
        }, 1400);
      } catch (err) {
        console.error(err);
        showError(err?.message || 'Sign up failed. Please try again.');
      } finally {
        setLoading(false);
      }
    });

    // Flatpickr (optional)
    window.addEventListener('DOMContentLoaded', () => {
      if (window.flatpickr) {
        flatpickr("#dob", {
          dateFormat: "Y-m-d",
          minDate: "1900-01-01",
          maxDate: "today",
          allowInput: true,
          disableMobile: true
        });
      }
    });
  </script>
</body>
</html>
